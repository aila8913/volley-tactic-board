openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
    description: Google OAuth session (login/callback are browser redirects, not listed here — see /me and /logout)
  - name: health
    description: Health operations
  - name: matches
    description: Matches, and the players/sets/rallies/events nested under a match
  - name: tactics
    description: Saved tactics board configurations (rotations, markers, defense ranges)
  - name: analysis
    description: Read-only cross-resource report endpoints for the analytics pages (M2)
paths:
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently logged-in user
      description: >
        Returns the signed-in user's identity from the session cookie. 401 (not 200 with a
        null body) when nobody is logged in, so the generated client's normal error handling
        (ApiError with status 401) doubles as the "not authenticated" signal — the frontend
        doesn't need a second, shape-based check.
      responses:
        "200":
          description: Currently logged-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Clear the session cookie
      responses:
        "204":
          description: Logged out

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List matches
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMatch"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{matchId}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a match by id
      responses:
        "200":
          description: The match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update a match (rename, move to another folder, mark finished)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatch"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
      tags: [matches]
      summary: Delete a match (cascades to its players/sets/rallies/events)
      responses:
        "204":
          description: Deleted

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List tournaments (folders)
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a tournament (folder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTournament"
      responses:
        "201":
          description: Created tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{tournamentId}:
    parameters:
      - $ref: "#/components/parameters/TournamentId"
    patch:
      operationId: updateTournament
      tags: [tournaments]
      summary: Rename a tournament (folder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournament"
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      summary: Delete a tournament (cascades to the matches inside it)
      responses:
        "204":
          description: Deleted

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams (grouping labels)
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTeam"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  # #287：新增比賽時，球隊帶出「這支球隊之前登錄過的人」當建議清單，讓使用者用「勾選＋微調」
  # 取代每場都重打一次名單。這支刻意寫在 /teams/{teamId} 之前——理由跟 /people/merge-candidates
  # 那段註解一樣：Express 是照路由「註冊順序」一個一個試，不是照路徑特異度排序，如果先註冊了
  # /teams/{teamId}（本身沒有子路徑段，但同樣的順序規則要顧到，避免以後有人在它下面加更多
  # 動詞路由時又得回頭搬順序），寫死的 /teams/{teamId}/roster-suggestions 段落要排在前面才安全。
  /teams/{teamId}/roster-suggestions:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamRosterSuggestions
      tags: [teams]
      summary: >-
        List people who have previously played for this team, one row per person (their most
        recent match's number/role), for the "new match" form to suggest as roster picks
      responses:
        "200":
          description: >-
            Suggested roster entries, newest lastPlayedAt first (only people with a resolved
            personId are included — a roster row without a cross-match identity can't be
            offered as a "this is the same person" suggestion)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterSuggestion"

  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Rename a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeam"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (unsets teamId on its matches; does not delete them)
      responses:
        "204":
          description: Deleted

  # #336：試用者一登入就能按一顆「載入示範資料」，把一整份示範比賽（球隊/人員/比賽/局分/
  # 戰術）灌進自己的帳號，不用面對空白畫面。GET 查目前有沒有；POST 兼做「載入」跟「重設」
  # 兩種語意——不管示範資料存不存在，POST 一律先清掉舊的再重種一份乾淨的（見
  # artifacts/api-server/src/routes/demoData.ts 的實作說明）；DELETE 單純清掉。
  /demo-data:
    get:
      operationId: getDemoDataStatus
      tags: [demoData]
      summary: Check whether the current user has demo data loaded
      responses:
        "200":
          description: Current demo data status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
    post:
      operationId: loadDemoData
      tags: [demoData]
      summary: >-
        Load demo data into the current user's account. If demo data already exists it is
        deleted first and re-seeded from scratch (i.e. this endpoint doubles as "reset demo
        data") — it never results in two copies.
      responses:
        "201":
          description: Demo data loaded (freshly seeded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDataStatus"
    delete:
      operationId: deleteDemoData
      tags: [demoData]
      summary: Delete the current user's demo data (matches/teams/people marked isDemo)
      responses:
        "204":
          description: Deleted

  /people:
    get:
      operationId: listPeople
      tags: [people]
      # #224：回應形狀從單純的 Person（id/name）換成 PersonSummary（多帶 matchCount/
      # teamNames），管理頁列表需要這些資訊才分得清楚同名的兩筆是誰是誰
      # （見 issue #224「不然同名的兩筆根本分不出誰是誰」）。刻意開一個新的 PersonSummary
      # schema，不直接放寬 Person 本身——POST/PATCH /people 跟 MergePeopleResult.target
      # 也回 Person，但那幾支是單純的 insert/update，算不出 matchCount/teamNames，
      # 硬把 Person 加這兩個必填欄位會讓那幾支回應違反自己的 schema。
      summary: List people (cross-match player identities), with match count and team names for telling same-named entries apart
      responses:
        "200":
          description: List of people, each with aggregated match count and team names
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonSummary"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPerson"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  # 這支刻意寫在 /people/{personId} 之前——Express 的路由比對是照「註冊順序」一個一個試，
  # 不是照路徑特異度排序，如果 /people/{personId} 先註冊，一支寫死的 /people/merge-candidates
  # 就會被 {personId} 這個萬用參數段先攔截、當成 personId="merge-candidates" 誤吃掉。
  # 目前 /people/{personId} 底下還沒有 GET（只有 PATCH/DELETE），所以現在還踩不到這個雷，
  # 但先把順序排對，避免之後有人幫 /people/{personId} 加了 GET 才踩雷、還得回頭搬順序。
  /people/merge-candidates:
    get:
      operationId: listMergeCandidates
      tags: [people]
      summary: List groups of people that look like duplicates of the same real person (same normalized name), for the merge UI to surface as suggestions
      responses:
        "200":
          description: Groups of same-name people, one group per normalized name (only names with 2+ people are included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MergeCandidateGroup"

  /people/{personId}:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Rename a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePerson"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person (unsets personId on any players linked to them; does not delete those roster rows or match history)
      responses:
        "204":
          description: Deleted

  /people/{personId}/merge:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    post:
      operationId: mergePeople
      tags: [people]
      summary: Merge one or more source people into this person (the target). Re-points their players.personId to the target, logs the merge for audit, then deletes the source people. Irreversible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergePeopleRequest"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergePeopleResult"

  # 一場比賽的影片段落（#390）。取代原本 matches.videoUrl 那一欄——一場比賽可能有好幾段
  # 影片（一局一段、錄到滿、換電池），一個欄位表達不了。讀寫都掛在 /matches/{matchId} 底下
  # （先驗 match 擁有權）；刪除走 /videos/{videoId}，跟 timeouts/substitutions 同一種形狀。
  /matches/{matchId}/videos:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listMatchVideos
      tags: [matches]
      summary: List the video segments of a match, in order
      responses:
        "200":
          description: List of video segments, ordered by sequence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchVideo"
    post:
      operationId: createMatchVideo
      tags: [matches]
      summary: Attach one video segment to a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMatchVideo"
      responses:
        "201":
          description: Created video segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchVideo"

  /videos/{videoId}:
    parameters:
      - $ref: "#/components/parameters/MatchVideoId"
    # 刪掉一段影片（例如網址貼錯）。rallies.videoId 是 onDelete: "set null"，所以錨在這段
    # 影片上的那些分會失去錨點、但紀錄本身完好——比賽資料比影片連結重要得多。
    delete:
      operationId: deleteMatchVideo
      tags: [matches]
      summary: Delete a video segment (rallies anchored to it keep their data, losing only the anchor)
      responses:
        "204":
          description: Deleted

  /matches/{matchId}/players:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listPlayers
      tags: [matches]
      summary: List players for a match
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [matches]
      summary: Add a player to a match's roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPlayer"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /matches/{matchId}/players/{playerId}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/PlayerId"
    patch:
      operationId: updatePlayer
      tags: [matches]
      summary: Update a player on a match's roster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayer"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [matches]
      summary: Remove a player from a match's roster
      responses:
        "204":
          description: Deleted

  /matches/{matchId}/sets:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listSets
      tags: [matches]
      summary: List sets for a match
      responses:
        "200":
          description: List of sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchSet"
    post:
      operationId: createSet
      tags: [matches]
      summary: Start a new set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSet"
      responses:
        "201":
          description: Created set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSet"

  /matches/{matchId}/sets/{setId}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/SetId"
    patch:
      operationId: updateSet
      tags: [matches]
      # 目前唯一的用途：補上開空局時還沒選的先發方（見 MatchSet.firstServer 註解）。
      summary: Update a set (currently only used to fill in firstServer once it's chosen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSet"
      responses:
        "200":
          description: Updated set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSet"

  # 一次拿整場比賽的所有 event（跨 set/rally）。前端進頁重建計分表時，靠這一支避免對
  # 每個 rally 各發一次 /rallies/:id/events（一場可能有幾百個 rally = 幾百個請求）。
  # 回傳仍是扁平的 MatchEvent[]，每筆自帶 rallyId，前端再依 rallyId 分組。
  /matches/{matchId}/events:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listMatchEvents
      tags: [matches]
      summary: List all events for a match (across all its sets/rallies), for rebuilding the scoresheet
      responses:
        "200":
          description: List of events, ordered by rally then sequence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEvent"

  /sets/{setId}/rallies:
    parameters:
      - $ref: "#/components/parameters/SetId"
    get:
      operationId: listRallies
      tags: [matches]
      summary: List rallies for a set
      responses:
        "200":
          description: List of rallies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rally"
    post:
      operationId: createRally
      tags: [matches]
      summary: Record a new rally (one point)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRally"
      responses:
        "201":
          description: Created rally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rally"

  /rallies/{rallyId}/events:
    parameters:
      - $ref: "#/components/parameters/RallyId"
    get:
      operationId: listEvents
      tags: [matches]
      summary: List events (individual ball touches) for a rally
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEvent"
    post:
      operationId: createEvent
      tags: [matches]
      summary: Record one ball touch, live during the match or backfilled from video review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewEvent"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"

  /rallies/{rallyId}:
    parameters:
      - $ref: "#/components/parameters/RallyId"
    # 進階版補填用（#390）：把一分錨到「哪一段影片的第幾秒」。
    # 為什麼是 PATCH 既有的 rally 而不是建立新資料：那一分在簡易版記錄時就已經存在了，
    # 補填是在同一列上補欄位——這跟 ADR-0010 決定 3「補填是就地升級、不是並存」同一個道理。
    patch:
      operationId: updateRally
      tags: [matches]
      summary: Update a rally (e.g. anchor it to a video segment + timestamp for review backfill)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRally"
      responses:
        "200":
          description: Updated rally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rally"
    delete:
      operationId: deleteRally
      tags: [matches]
      summary: Delete a rally (e.g. undo the last point; cascades to its events)
      responses:
        "204":
          description: Deleted

  # 一次拿整場比賽的所有換人紀錄（跨 set），道理跟 /matches/{matchId}/events 一樣：
  # 前端進頁重建計分表/上場名單時，一支請求就夠，不用對每個 set 各發一次。
  # substitutions 自己沒存 matchId，所以 join substitutions→sets，用 sets.matchId 過濾。
  /matches/{matchId}/substitutions:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listMatchSubstitutions
      tags: [matches]
      summary: List all substitutions for a match (across all its sets), for rebuilding lineups
      responses:
        "200":
          description: List of substitutions, ordered by set then score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Substitution"

  /sets/{setId}/substitutions:
    parameters:
      - $ref: "#/components/parameters/SetId"
    post:
      operationId: createSubstitution
      tags: [matches]
      summary: Record one substitution (regular sub or libero in/out) within a set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSubstitution"
      responses:
        "201":
          description: Created substitution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Substitution"

  # 刪掉一筆換人紀錄（前端「復原」退掉上一個換人動作時用，見 issue #41）。
  # 換人是 append-only 的，undo 靠 hard-delete 這一筆 row（不寫補償 row）——因為換人的
  # 記錄時機是「比分快照」而非明確時間戳，補償 row 的比分較低、reload 重放時會排在前面
  # 空轉、幽靈紀錄反而留著，所以只能真的把 row 刪掉（詳見 issue #41 討論）。
  /substitutions/{substitutionId}:
    parameters:
      - $ref: "#/components/parameters/SubstitutionId"
    delete:
      operationId: deleteSubstitution
      tags: [matches]
      summary: Delete a substitution (e.g. undo the last substitution action)
      responses:
        "204":
          description: Deleted

  # 暫停紀錄（issue #44）。整組路由刻意跟 substitutions 平行：讀（bulk）掛在
  # /matches/{matchId}/timeouts、寫掛在 /sets/{setId}/timeouts、undo 走 DELETE /timeouts/{id}。
  /matches/{matchId}/timeouts:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listMatchTimeouts
      tags: [matches]
      summary: List all timeouts for a match (across all its sets), for rebuilding the scoresheet
      responses:
        "200":
          description: List of timeouts, ordered by set then score
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Timeout"

  /sets/{setId}/timeouts:
    parameters:
      - $ref: "#/components/parameters/SetId"
    post:
      operationId: createTimeout
      tags: [matches]
      summary: Record one timeout within a set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTimeout"
      responses:
        "201":
          description: Created timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeout"

  # 刪掉一筆暫停紀錄（前端「復原」退掉上一個暫停動作時用）。跟 substitutions 一樣是 append-only、
  # 記錄時機是比分快照，所以 undo 只能 hard-delete 這一筆 row（見 substitutions 的同段說明）。
  /timeouts/{timeoutId}:
    parameters:
      - $ref: "#/components/parameters/TimeoutId"
    delete:
      operationId: deleteTimeout
      tags: [matches]
      summary: Delete a timeout (e.g. undo the last timeout action)
      responses:
        "204":
          description: Deleted

  # 一場比賽每一局的起始先發（我方六個號位 1~6 各站哪個球員；自由球員不列入，見
  # lib/db/src/schema/lineups.ts）。讀（bulk）掛在 /matches/:matchId/lineups 底下
  # （先驗 match 擁有權），道理跟 /matches/:matchId/substitutions 一樣：前端進計分表
  # 重建時一支請求把整場所有局的先發拿回來，不用對每個 set 各發一次。
  /matches/{matchId}/lineups:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: listMatchLineups
      tags: [matches]
      summary: List all starting lineups for a match (one per set), for rebuilding the scoresheet
      responses:
        "200":
          description: List of lineups, ordered by set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lineup"

  # 寫掛在 /sets/:setId/lineup 底下（先驗 set 擁有權往上追到 match.userId）。一局一 row
  # （schema 的 setId 是 unique），所以用 PUT（idempotent upsert）而不是 POST：教練若重按
  # 先發或修正，同一局就覆寫那一 row，不會長出第二筆——語意上「設定這一局的先發」也剛好
  # 對應 PUT（把某個資源設成給定內容）。
  /sets/{setId}/lineup:
    parameters:
      - $ref: "#/components/parameters/SetId"
    put:
      operationId: putSetLineup
      tags: [matches]
      summary: Set (upsert) the starting lineup for a set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewLineup"
      responses:
        "200":
          description: Created or updated lineup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineup"

  /tactics:
    get:
      operationId: listTactics
      tags: [tactics]
      summary: List saved tactics for the current user, filtered by matchId / scope, newest-updated first
      parameters:
        # 依比賽過濾戰術庫（#119）。帶 matchId 就只回這場的戰術，戰術面板才不會跨場汙染。
        - name: matchId
          in: query
          required: false
          schema:
            type: integer
        # #372 決策④：空板（沒有 matchId）進戰術板時，也要能只看「全域戰術庫」——
        # 也就是 matchId 為 null 的那些。這個需求乍看可以用 matchId 參數表達，但其實不行：
        # URL query string 沒辦法區分「?matchId=」（空字串）跟「完全不帶 matchId」，
        # 兩者在 Express 收到的 req.query 裡都很難乾淨地跟「matchId 是 null」畫上等號——
        # 「只要 matchId 是 null 的」這個篩選條件，本質上就是表達不出來，所以另開一個
        # 明確的旗標 scope=global 來表達。
        # 三種模式：
        #   - 帶 matchId：只回那場比賽的戰術（#119，不變）
        #   - 帶 scope=global：只回 matchId IS NULL 的戰術（空板進去的戰術庫）
        #   - 都不帶：回全部（不變）
        # 如果兩者同時帶，matchId 贏（前端不會同時送兩個，這裡只是把行為講清楚）。
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [global]
      responses:
        "200":
          description: List of tactics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tactic"
    post:
      operationId: createTactic
      tags: [tactics]
      summary: Save a new tactic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTactic"
      responses:
        "201":
          description: Created tactic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactic"

  /tactics/{tacticId}:
    parameters:
      - $ref: "#/components/parameters/TacticId"
    get:
      operationId: getTactic
      tags: [tactics]
      summary: Get a single tactic by id
      responses:
        "200":
          description: The tactic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactic"
    put:
      operationId: updateTactic
      tags: [tactics]
      summary: Overwrite an existing tactic (name and/or data)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTactic"
      responses:
        "200":
          description: Updated tactic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tactic"
    delete:
      operationId: deleteTactic
      tags: [tactics]
      summary: Delete a tactic
      responses:
        "204":
          description: Deleted

  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    patch:
      operationId: updateEvent
      tags: [matches]
      summary: Correct or fill in details on an existing event (e.g. during video review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEvent"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchEvent"
    delete:
      operationId: deleteEvent
      tags: [matches]
      summary: Delete an event (e.g. recorded by mistake)
      responses:
        "204":
          description: Deleted

  # M2 分析頁「各輪次得失分」（#65）。跟上面 /matches/{matchId}/* 那些「一資源一 CRUD」的路徑
  # 不同，這支是純讀的報表型聚合：把一場比賽底下所有 rally 依 homeRotation 分組算得失分，
  # 不對應單一資料表，所以獨立掛在 /analysis 底下、用專屬的 analysis tag，不硬塞進 matches。
  # 只用 rallies.winner/homeRotation 算，不碰 events——不是因為 events.outcome 沒有值
  # （#365 已經補上寫入路徑，/analysis/people/{personId} 也已經在消費它，見該路由下面的
  # 長註解），而是輪次統計要的是「每分必有」的資料來源：rallies.homeRotation/winner 兩欄
  # 隨計分即時寫入、每筆 rally 必填，events 則有「沒看到」逃生閥允許整分不留任何 event，
  # 改用 events 當輪次來源會漏算那種分。
  /analysis/matches/{matchId}/rotations:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      operationId: getMatchRotationStats
      tags: [analysis]
      summary: Get per-rotation points won/lost for a match, aggregated from rallies
      responses:
        "200":
          description: >-
            One row per rotation that has at least one rally recorded (rotations with no data are
            omitted; the frontend only renders as many rows as it gets back).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RotationStat"

  # M2 分析頁「視圖②：跨場彙總」（#65）。跟上面 /rotations 一樣是純讀的報表型聚合，但這支
  # 不掛在單一 matchId 底下——回傳「這個使用者名下每一場比賽」各一列摘要，一支請求就拿到
  # 全部場次的得失分/局數，讓分析頁可以一覽多場而不必逐場 fan-out（見 MatchList.tsx 目前
  # 卡片改讀本機 store 閃避 fan-out 的取捨，那段留給之後再處理）。
  /analysis/matches:
    get:
      operationId: listMatchAnalysis
      tags: [analysis]
      summary: Get a one-row-per-match summary (opponent, date, sets played, points) for every match owned by the current user
      responses:
        "200":
          description: One row per match, ordered by date (newest first).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchAnalysisSummary"

  # M2 分析頁「視圖③：球員跨場/跨隊分析」(#213)。跟 /analysis/matches 一樣是純讀的報表型聚合，
  # 但這裡的聚合單位是「人」（people.id）而非「比賽」——把一個人跨越多場、可能跨隊的出賽紀錄、
  # 各場背號/位置、觸球動作分布、先發局數全部彙整成一份，讓 people 這層「跨場身分」真的有地方
  # 被用到（否則 #212 建的 people CRUD 只是白建一張表）。
  #
  # events.outcome（得分/失分）從這支路由開始有消費者了（#370）：actionCounts 之外多回傳
  # outcomeBreakdown，把跨場的觸球依 action 拆成 point/loss/in_play/unknown 幾桶。仍然
  # 不做的是比率統計（side-out%／決定率）：那需要知道「這一分開始時是誰在發球」，要從
  # 發球序反推，邏輯複雜到不適合塞進這支聚合查詢，留給 #235。
  /analysis/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    get:
      operationId: getPersonAnalysis
      tags: [analysis]
      summary: Get a cross-match/cross-team analysis for one person (appearances, action counts, sets started)
      responses:
        "200":
          description: Aggregated cross-match stats for this person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonAnalysis"

components:
  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: integer
    PlayerId:
      name: playerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SetId:
      name: setId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RallyId:
      name: rallyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchVideoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubstitutionId:
      name: substitutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimeoutId:
      name: timeoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TacticId:
      name: tacticId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TournamentId:
      name: tournamentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # team id 是整數（serial），不是 uuid——跟 tournaments 不同，見 lib/db/src/schema/teams.ts。
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
    # person id 一樣是整數（serial）——跟 team 同理，見 lib/db/src/schema/people.ts。
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CurrentUser:
      type: object
      properties:
        # Google 帳號的 sub 宣告，也是 matches/tournaments/teams/people/tactics 各表 userId
        # 欄位存的值。給前端用來判斷「已登入」，不是給前端拿去做任何比對邏輯。
        userId:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - userId
        - email
        - name

    # 跟前端比賽名單的角色定義一致 (artifacts/volleyball-tactics/src/types/match.ts 的 PLAYER_ROLES)
    # 以及後端 DB schema 的 playerRoleEnum (lib/db/src/schema/players.ts)。
    PlayerRole:
      type: string
      enum: [S, OH, MB, OPP, L]

    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
        matchId:
          type: integer
        name:
          type: string
        # 背號；DB schema (lib/db/src/schema/players.ts) 是 notNull，前端名單本來就有這欄位。
        number:
          type: integer
        role:
          $ref: "#/components/schemas/PlayerRole"
        # 這名單列對應到哪個跨場「真實身分」（見 lib/db/src/schema/people.ts 的 Person）。
        # null 代表這個名單列還沒被對應到任何身分（例如剛建立、或使用者主動解除對應）。
        # 一定會回這個欄位（放進 required），讓前端不用另外判斷 undefined vs null。
        personId:
          type: integer
          nullable: true
      required: [id, matchId, name, number, role, personId]

    NewPlayer:
      type: object
      properties:
        # id 選填：前端可以自己生一個 uuid 當作球員 id 傳進來（client-mintable，見
        # lib/db/src/schema/players.ts 的 id 欄位改動說明）；不傳的話由資料庫的
        # defaultRandom() 自動生一個。
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: integer
        role:
          $ref: "#/components/schemas/PlayerRole"
        # 選填：新增名單列時可以順便指定對應到哪個既有身分；不帶就是 null（尚未對應）。
        personId:
          type: integer
          nullable: true
      required: [name, number, role]

    Tournament:
      type: object
      properties:
        # 資料夾 id：uuid（client-mintable，見 lib/db/src/schema/tournaments.ts）。
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, createdAt]

    NewTournament:
      type: object
      properties:
        # id 選填：前端可自己生一個 uuid 傳進來（client-mintable），不傳則由 DB 的 defaultRandom() 生。
        id:
          type: string
          format: uuid
        name:
          type: string
      required: [name]

    UpdateTournament:
      type: object
      # 目前資料夾只有名稱可改，所以更新就是改名；name 選填以保持 PATCH「只帶想改的」語意。
      properties:
        name:
          type: string

    # 球隊＝分組標籤（見 lib/db/src/schema/teams.ts）。id 是整數（serial），沒有 createdAt 欄位，
    # 所以這裡只有 id/name——比 Tournament 更精簡。
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]

    # GET /teams/{teamId}/roster-suggestions 回應裡的一列（#287）：這支球隊之前登錄過的某個人，
    # 取自他在這支球隊「最近一場比賽」的那筆名單列（players）。name/number/role 特意取
    # players 那一列的值、不是 people.name——people.name 只是跨場身分的標籤，實際登錄在名單上
    # 的姓名/背號/位置以 players 為準（跟 name/number/role 同一列來源才一致）；取「最近一場」
    # 而非彙總所有場次，是因為背號/位置本來就會換季換人變，最近一次最可能還是對的。
    RosterSuggestion:
      type: object
      properties:
        # 只回有對應到跨場身分的建議——沒有 personId 的名單列沒辦法確認「這是同一個人」，
        # 勾了也串不起統計，所以這裡不是 nullable。
        personId:
          type: integer
        name:
          type: string
        number:
          type: integer
        role:
          $ref: "#/components/schemas/PlayerRole"
        # 這個人在這支球隊出賽過幾場，給使用者判斷是不是常客。
        matchCount:
          type: integer
        lastPlayedAt:
          type: string
          format: date-time
      required: [personId, name, number, role, matchCount, lastPlayedAt]

    NewTeam:
      type: object
      # id 不收 client 生的（serial 由 DB 自動遞增），所以新增只需要 name。
      properties:
        name:
          type: string
      required: [name]

    UpdateTeam:
      type: object
      # 球隊目前也只有名稱可改；name 選填以保持 PATCH「只帶想改的」語意。
      properties:
        name:
          type: string

    # GET/POST /demo-data 的回應（#336）。matchIds 依日期排序，方便前端直接用來組
    # 「去看看這些比賽」的連結；present 是為了讓前端不用另外靠 `matchIds.length === 0`
    # 推斷，語意更直白。
    DemoDataStatus:
      type: object
      properties:
        present:
          type: boolean
        matchIds:
          type: array
          items:
            type: integer
      required: [present, matchIds]

    # person＝跨比賽的「真實身分」（見 lib/db/src/schema/people.ts），用來讓同一個人在不同場次的
    # 名單列（players）能被認出是同一人，之後才能做跨場統計。形狀跟 Team 一樣精簡：只有 id/name，
    # 沒有 createdAt。
    Person:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]

    # GET /people 回應裡的一列：Person 的欄位再加上 matchCount/teamNames 這兩個彙整出來的
    # 識別資訊（#224）。形狀跟下面的 MergeCandidatePerson 一模一樣，但特意分開兩個
    # schema 名字——語意上 PersonSummary 是「管理頁列表」在用，MergeCandidatePerson 是
    # 「合併候選組」在用，即使現在欄位相同，以後兩邊需求分岔時不用先拆 schema 再改。
    PersonSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        matchCount:
          type: integer
        teamNames:
          type: array
          items:
            type: string
      required: [id, name, matchCount, teamNames]

    NewPerson:
      type: object
      # id 不收 client 生的（serial 由 DB 自動遞增），所以新增只需要 name。
      properties:
        name:
          type: string
      required: [name]

    UpdatePerson:
      type: object
      # person 目前也只有名稱可改；name 選填以保持 PATCH「只帶想改的」語意。
      properties:
        name:
          type: string

    # GET /people/merge-candidates 回應裡的一列：這個人在球隊/場次上下文裡的識別資訊，
    # 讓使用者在合併確認畫面上分得清楚「這兩筆同名的 person，到底是不是真的同一個人」。
    # 光看名字沒辦法分辨——同名同姓在系隊情境不罕見（見 scripts/backfill-person-ids.ts
    # 的說明），所以多帶 matchCount/teamNames 這種側面資訊給人工判斷用。
    MergeCandidatePerson:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        matchCount:
          type: integer
        teamNames:
          type: array
          items:
            type: string
      required: [id, name, matchCount, teamNames]

    # 同一個正規化姓名（見 artifacts/api-server/src/lib/personName.ts 的 normalizePersonName）
    # 底下的一組候選 person，成員數一定 ≥ 2（只有 1 筆代表沒有同名的人，不算候選）。
    MergeCandidateGroup:
      type: object
      properties:
        normalizedName:
          type: string
        people:
          type: array
          items:
            $ref: "#/components/schemas/MergeCandidatePerson"
      required: [normalizedName, people]

    # POST /people/{personId}/merge 的請求體：{personId} 是合併後留下來的目標，
    # sourceIds 是要被併進去、之後會被刪除的來源 person id 清單。至少要有一筆
    # （minItems: 1）——空陣列代表「什麼都不併」，語意上沒有意義，直接在 schema 層擋掉。
    MergePeopleRequest:
      type: object
      properties:
        sourceIds:
          type: array
          items:
            type: integer
          minItems: 1
      required: [sourceIds]

    # POST /people/{personId}/merge 的回應：target 是合併後（可能改了名字的）完整目標
    # person；mergedSourceNames 是實際被併掉的來源名字快照（用來讓前端顯示「已合併：王小明、
    # 王小明」這種確認訊息）；movedPlayerCount 是總共改指了幾筆名單列，給使用者一個
    # 「這次操作影響了多大範圍」的量級感。
    MergePeopleResult:
      type: object
      properties:
        target:
          $ref: "#/components/schemas/Person"
        mergedSourceNames:
          type: array
          items:
            type: string
        movedPlayerCount:
          type: integer
      required: [target, mergedSourceNames, movedPlayerCount]

    Match:
      type: object
      properties:
        id:
          type: integer
        # 自訂比賽標題；nullable，因為前端目前用 opponent 當標題、不一定會填 name
        # （見 lib/db/src/schema/matches.ts 的 name 改 nullable 說明）。
        name:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        opponent:
          type: string
        location:
          type: string
          nullable: true
        # ⚠️ 影片連結不在這裡：原本的 videoUrl 已於 #390 移除，改用 GET/POST
        # /matches/{matchId}/videos（一場比賽可以有好幾段影片）。
        # 這場比賽所屬資料夾（Tournament）的 id。#117 後資料夾進了 DB，這是指向 tournaments 表
        # 的 uuid 外鍵。null 代表放在最上層、沒歸到任何資料夾。
        tournamentId:
          type: string
          format: uuid
          nullable: true
        # 這場比賽標到哪支球隊（分組標籤）。整數外鍵指向 teams 表；null＝未分類。
        teamId:
          type: integer
          nullable: true
        # 賽制：best_of_3（三戰兩勝，先拿 2 局獲勝）／best_of_5（五戰三勝，先拿 3 局獲勝）。
        # DB 是 notNull + default("best_of_3")（見 lib/db/src/schema/matches.ts），所以回應一定有值，
        # 放進 required、不用 nullable。
        format:
          type: string
          enum: [best_of_3, best_of_5]
        # 這場比賽結束了沒（#218）：in_progress＝還在打／還在補記，finished＝記錄者已經
        # 明確按下「結束比賽」。這個值決定「sets 的最後一局算不算已結束局」——見
        # lib/db/src/schema/matches.ts 的 matchStatusEnum 註解與 ADR-0005。
        # DB 是 notNull + default("in_progress")，所以回應一定有值，放進 required、不用 nullable。
        status:
          type: string
          enum: [in_progress, finished]
        createdAt:
          type: string
          format: date-time
      required: [id, date, opponent, createdAt, format, status]

    NewMatch:
      type: object
      properties:
        name:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        opponent:
          type: string
        location:
          type: string
          nullable: true
        tournamentId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: integer
          nullable: true
        # 賽制，選填：沒帶就吃 DB 的 default("best_of_3")，不用在這裡重複寫一次預設值。
        format:
          type: string
          enum: [best_of_3, best_of_5]
      required: [date, opponent]

    UpdateMatch:
      type: object
      properties:
        # NewMatch 有 name 而這裡沒有，是建立時設得了、之後改不了的不對稱（#385，由 #368
        # 的窮舉檢查照出來）。nullable 沿用 NewMatch：帶字串＝改標題，帶 null＝清空回「用
        # 對手名稱當標題」，完全不帶＝不動它——三種狀態都要能表達。
        name:
          type: string
          nullable: true
        opponent:
          type: string
        # 編輯比賽時可改日期時間（前端編輯表單有 datetime-local 欄位）。
        date:
          type: string
          format: date-time
        location:
          type: string
          nullable: true
        tournamentId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: integer
          nullable: true
        # 賽制，選填：PATCH 只帶想改的欄位，不帶就維持原值。
        format:
          type: string
          enum: [best_of_3, best_of_5]
        # 比賽狀態（#218）。計分頁的「結束比賽」送 finished、「重新開啟比賽」送 in_progress
        # ——收尾／重新開啟不另開端點，就是往這支既有的 PATCH 帶這一個欄位。
        # 刻意不放進 NewMatch：建立比賽時一律吃 DB 的 default("in_progress")，不給前端
        # 表達「一建立就是完賽」這種不合理的狀態。
        status:
          type: string
          enum: [in_progress, finished]

    UpdatePlayer:
      type: object
      # 部分更新一名球員：欄位都是 optional，只帶想改的。
      properties:
        name:
          type: string
        number:
          type: integer
        role:
          $ref: "#/components/schemas/PlayerRole"
        # 選填、且 nullable：帶數字＝改對應到另一個身分；帶 null＝解除對應；
        # 完全不帶這個欄位＝不動它。三種狀態都要能表達，所以不能只用「有沒有帶」二分。
        personId:
          type: integer
          nullable: true

    # 這一局由哪一方先發球（home = 我方、away = 對方）。前端計分表的比分/輪轉/發球方
    # 都能從「先發方 + 各 rally 的 winner」重算，唯獨先發方推不出來，所以存在 set 上。
    ServingSide:
      type: string
      enum: [home, away]

    MatchSet:
      type: object
      properties:
        # id 從整數改成 uuid（#64 PR1）：離線寫入佇列需要前端在還沒連上網路時就能自己決定
        # setId，好讓緊接著記錄的 rally/event 有 id 可以引用，不用等 POST 回應。
        id:
          type: string
          format: uuid
        matchId:
          type: integer
        setNumber:
          type: integer
        # nullable：按「下一局」的當下就會先建一筆空 set row（讓 reload 能正確認出「這局還在選
        # 先發方」），此時還沒人選先發方，firstServer 就是 null；選完先發方後再用 PATCH 補上。
        firstServer:
          $ref: "#/components/schemas/ServingSide"
          nullable: true
      required: [id, matchId, setNumber, firstServer]

    NewSet:
      type: object
      properties:
        # 選填的 client-mintable 主鍵（#64 PR2）。離線記錄時前端得先有 id 才能把「建立」跟
        # 之後的「刪除」寫成同一條有序 write log，不能等 POST 回來才知道 id——所以主鍵在
        # #64 PR1 改成 uuid，這裡把它開放給前端指定。不帶就照舊由 DB 產（defaultRandom）。
        # 之所以是選填而不是必填：舊呼叫端與手動測試不用改，且 seed/腳本仍可讓 DB 決定。
        id:
          type: string
          format: uuid
        setNumber:
          type: integer
        # 開新的一局時：如果先發方還沒選（空局，見 MatchSet.firstServer 註解），送 null；
        # 已知先發方（例如既有流程「選完先發方才建 set」）就直接帶值。
        firstServer:
          $ref: "#/components/schemas/ServingSide"
          nullable: true
      required: [setNumber, firstServer]

    UpdateSet:
      type: object
      # 補上開空局時還沒選的先發方，等使用者選好之後 PATCH 這支把它填回去。
      properties:
        firstServer:
          $ref: "#/components/schemas/ServingSide"
      required: [firstServer]

    RallyWinner:
      type: string
      enum: [home, away]

    Rally:
      type: object
      properties:
        # id/setId 從整數改成 uuid（#64 PR1），理由同 MatchSet.id。
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        rallyNumber:
          type: integer
        # 這分開始前的比分，不是結束後的——見 docs/db-schema-spec.md 的設計理由。
        homeScore:
          type: integer
        awayScore:
          type: integer
        # 這分開始前的輪次快照（0–5），跟 homeScore/awayScore 同一套語意——給 M2 分析頁
        # （#65）當 join key 用，不用回放整局歷史才能知道某一球發生時的輪次。
        homeRotation:
          type: integer
        awayRotation:
          type: integer
        winner:
          $ref: "#/components/schemas/RallyWinner"
        # 影片錨定（#390）：這一分在哪一段影片的第幾秒。nullable——簡易版當下記的那一分
        # 沒有影片可指，補填之後才會有值。掛在 rally 而不是 event 的理由見
        # lib/db/src/schema/rallies.ts。
        videoId:
          type: string
          format: uuid
          nullable: true
        videoTimestamp:
          type: integer
          nullable: true
      required: [id, setId, rallyNumber, homeScore, awayScore, homeRotation, awayRotation, winner]

    NewRally:
      type: object
      properties:
        # 選填的 client-mintable 主鍵，理由同 NewSet.id（#64 PR2）。
        id:
          type: string
          format: uuid
        rallyNumber:
          type: integer
        homeScore:
          type: integer
        awayScore:
          type: integer
        homeRotation:
          type: integer
        awayRotation:
          type: integer
        winner:
          $ref: "#/components/schemas/RallyWinner"
        # 選填：從空白開始補填時（沒有簡易版資料）建立這一分，可以直接帶上影片錨點，
        # 不用建完再 PATCH 一次。
        videoId:
          type: string
          format: uuid
          nullable: true
        videoTimestamp:
          type: integer
          nullable: true
      required: [rallyNumber, homeScore, awayScore, homeRotation, awayRotation, winner]

    UpdateRally:
      type: object
      properties:
        # 影片錨定（#390）：這一分對應「哪一段影片的第幾秒」。兩欄都是 nullable，
        # 三種狀態要能分開表達：帶值＝設定錨點、帶 null＝清掉錨點、完全不帶＝不動它。
        videoId:
          type: string
          format: uuid
          nullable: true
        videoTimestamp:
          type: integer
          nullable: true

    # 一場比賽的一段影片（#390）。取代原本 matches.videoUrl 那一欄，理由見
    # lib/db/src/schema/matchVideos.ts。
    MatchVideo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        # matches.id 是 serial 整數，所以這裡是 integer 不是 uuid。
        matchId:
          type: integer
        url:
          type: string
        # 這是這場比賽的第幾段（從 1 開始）。用明確的順序欄位，不靠建立時間排序——
        # 使用者可能事後才補貼漏掉的中間那一段。
        sequence:
          type: integer
        # 人看的標籤（例如「第一局」）；null 就由前端顯示「第 N 段」。
        label:
          type: string
          nullable: true
      required: [id, matchId, url, sequence]

    NewMatchVideo:
      type: object
      properties:
        # 選填的 client-mintable 主鍵，理由同 NewSet.id（#64 PR2）。
        id:
          type: string
          format: uuid
        url:
          type: string
        sequence:
          type: integer
        label:
          type: string
          nullable: true
      required: [url, sequence]

    # GET /analysis/matches/{matchId}/rotations 的一列：我方在某個輪次時的得失分彙總。
    # rotation 沿用 rallies.homeRotation 的語意——從先發起算的第幾輪（0–5），不是場上號位。
    RotationStat:
      type: object
      properties:
        rotation:
          type: integer
        pointsWon:
          type: integer
        pointsLost:
          type: integer
      required: [rotation, pointsWon, pointsLost]

    # GET /analysis/matches 的一列裡「已結束局」的比分。逐局的我方/對方得分，讓首頁列表
    # 卡片能算出「局比數」(例如 3:0) ——排球講一場結果的單位是「贏了幾局」而不是總分，
    # 所以需要逐局結果、不能只靠彙總的 ourPoints/opponentPoints。
    SetResult:
      type: object
      properties:
        ourScore:
          type: integer
        opponentScore:
          type: integer
      required: [ourScore, opponentScore]

    # GET /analysis/matches 的一列：一場比賽的摘要，供「視圖②：跨場彙總」逐場列出，
    # 也給首頁比賽列表卡片直接讀（不必逐場 hydrate 本機 store，見 pages/MatchList.tsx）。
    # setsPlayed 只算真正開過球的局（firstServer 不是 null），呼應 sets 表 firstServer
    # 允許 null 的設計（還沒選先發方的空局不算「打過」，見 lib/db/src/schema/sets.ts）。
    # teamId 沒放進 required：跟 matches 表一樣，可能沒有指定球隊。
    #
    # setResults：只含「已結束局」(排除進行中的最後一局)，鏡射前端 reconstructRecording
    # 的「最後一局＝進行中、其餘＝已結束」慣例，讓卡片顯示的局比數跟點進去計分頁後一致。
    # hasLineup：這場是否已有任一局凍結過先發(lineups 表有 row)，給卡片決定要不要亮
    # 「尚未排先發」黃標。注意輪轉表上「排好但還沒開賽」的暫存站位不進 DB(見
    # useRotationTable.ts 的 partialize)，所以 server 只認已凍結進 lineups 的那種。
    MatchAnalysisSummary:
      type: object
      properties:
        matchId:
          type: integer
        opponent:
          type: string
        date:
          type: string
          format: date-time
        teamId:
          type: integer
          nullable: true
        setsPlayed:
          type: integer
        ourPoints:
          type: integer
        opponentPoints:
          type: integer
        setResults:
          type: array
          items:
            $ref: "#/components/schemas/SetResult"
        hasLineup:
          type: boolean
      required:
        [matchId, opponent, date, setsPlayed, ourPoints, opponentPoints, setResults, hasLineup]

    # GET /analysis/people/{personId} 的一列：這個人在某支球隊（teamId，null＝未分類）
    # 底下出賽了幾場——回答「這個人跨隊嗎、各隊各出賽幾場」。grain 是 match（見後端路由
    # 註解的「拆成單一 grain 查詢」那段），所以這裡只彙總場數，不重複列出動作/局數細節。
    PersonTeamBreakdown:
      type: object
      properties:
        teamId:
          type: integer
          nullable: true
        matchesPlayed:
          type: integer
      required: [teamId, matchesPlayed]

    # GET /analysis/people/{personId} 的一列：這個人各種觸球動作（發/接/舉/攻/攔/防）的次數，
    # 跨所有場次加總、跨 outcome 加總。grain 是 event（見後端路由註解），純粹數
    # events.action 的分布，不含得失分細節——那個維度現在由 PersonOutcomeBreakdown
    # （#370）提供，這欄自己維持原本「一個 action 一列」的形狀不變，是既有前端消費它的
    # 假設，不隨查詢細化而跟著變。
    PersonActionCount:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/EventAction"
        count:
          type: integer
      required: [action, count]

    # GET /analysis/people/{personId} 的一列：這個人某個觸球動作跨所有場次的得失分結構
    # （#370）。以 EventSide 為基準看這球「誰執行」，outcome 沿用 EventOutcome 的定義：
    # points = 這個動作直接得分、losses = 直接失分、inPlay = 球還在繼續（簡易版理論上不會
    # 出現，見 EventOutcome 的長註解，但這裡不假設一定沒有）。unknown 是 outcome 為 null
    # 的筆數——events.outcome 是 nullable 欄位，新環境（例如還沒跑過
    # scripts/src/backfill-event-outcomes.ts 的全新 DB）一定會有這種列，這裡老實秀出來，
    # 不要悄悄併進其他桶或直接丟掉。
    PersonOutcomeBreakdown:
      type: object
      properties:
        action:
          $ref: "#/components/schemas/EventAction"
        points:
          type: integer
        losses:
          type: integer
        inPlay:
          type: integer
        unknown:
          type: integer
      required: [action, points, losses, inPlay, unknown]

    # GET /analysis/people/{personId} 的一列：這個人在某一場比賽裡的一筆名單列——背號、位置、
    # 屬於哪支球隊。people 這層存在的意義正是「同一個人不同場可能不同背號/位置」，所以這裡
    # 刻意保留逐場的原始名單列，而不是只回一個「目前」的背號/位置。playerId 讓前端能把這一列
    # 跟該場比賽底下的其他資料（例如換人紀錄）對起來，雖然這頁目前用不到。
    PersonAppearance:
      type: object
      properties:
        matchId:
          type: integer
        opponent:
          type: string
        date:
          type: string
          format: date-time
        teamId:
          type: integer
          nullable: true
        playerId:
          type: string
          format: uuid
        number:
          type: integer
        role:
          $ref: "#/components/schemas/PlayerRole"
      required: [matchId, opponent, date, playerId, number, role]

    # GET /analysis/people/{personId} 的整體回應：一個人跨場/跨隊的彙總視圖（#213 視圖③）。
    # matchesPlayed／setsStarted／teamBreakdown／actionCounts／appearances 分別來自後端
    # 路由裡各自獨立的單一 grain 查詢（match／set／team+match／event／player row），在應用層
    # 合併——理由跟 /analysis/matches 的長註解一樣：不同 grain 硬湊進同一支 SQL join 會被
    # 笛卡兒積撐大，算出來的數字會是假的。
    PersonAnalysis:
      type: object
      properties:
        personId:
          type: integer
        name:
          type: string
        matchesPlayed:
          type: integer
        # 先發局數：lineups 六個號位（zone1~6）任一命中這個人在任一場的 playerId，
        # 就算這一局他先發過。跨場加總，不分球隊。
        setsStarted:
          type: integer
        teamBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PersonTeamBreakdown"
        actionCounts:
          type: array
          items:
            $ref: "#/components/schemas/PersonActionCount"
        # 得失分結構（#370）：跟 actionCounts 來自同一支查詢的同一批列，只是合併規則不同——
        # actionCounts 是跨 outcome 加總，這欄是依 outcome 拆桶。見後端 analysisSummary.ts
        # 的 summarisePerson 長註解。
        outcomeBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/PersonOutcomeBreakdown"
        appearances:
          type: array
          items:
            $ref: "#/components/schemas/PersonAppearance"
      required:
        [
          personId,
          name,
          matchesPlayed,
          setsStarted,
          teamBreakdown,
          actionCounts,
          outcomeBreakdown,
          appearances,
        ]

    # 換人的種類，見 lib/db/src/schema/substitutions.ts 的 substitutionKindEnum 註解：
    # regular = 一般換人；libero = 自由球員上/下（規則上不算正式換人次數，但記錄結構相同）。
    SubstitutionKind:
      type: string
      enum: [regular, libero]

    Substitution:
      type: object
      properties:
        # id/setId 從整數改成 uuid（#64 PR1），理由同 MatchSet.id。
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        # 換人發生的「時機」，存的是這一局當下的比分快照（而非 rallyId）——
        # 理由跟 Rally 的 homeScore/awayScore 一樣，見 lib/db/src/schema/substitutions.ts。
        homeScore:
          type: integer
        awayScore:
          type: integer
        # 上場、下場的球員；nullable，理由見 substitutions.ts：即使不知道是「誰」，
        # 「這一局發生過一次換人」本身仍有統計意義，球員被刪除時不該連帶刪掉這筆紀錄。
        playerInId:
          type: string
          format: uuid
          nullable: true
        playerOutId:
          type: string
          format: uuid
          nullable: true
        kind:
          $ref: "#/components/schemas/SubstitutionKind"
        # 伺服器指派的插入順序流水號，只給「同一分內排序」用，不是給前端識別身分用的。
        # id 改成 uuid 之後不再帶時序資訊，不能拿來當 orderBy 的 tiebreaker（見
        # lib/db/src/schema/substitutions.ts、artifacts/api-server/src/routes/substitutions.ts
        # 的 orderBy 註解），所以另外開一個欄位。這是 row 的真實欄位（getTableColumns 會回傳
        # 它），所以要宣告在回應 schema 裡，不然跟實際回應對不上；但 NewSubstitution 不能有
        # 這個欄位——它是 server-assigned，前端不該送。
        seq:
          type: integer
      required: [id, setId, homeScore, awayScore, playerInId, playerOutId, kind, seq]

    NewSubstitution:
      type: object
      properties:
        # 選填的 client-mintable 主鍵，理由同 NewSet.id（#64 PR2）。
        id:
          type: string
          format: uuid
        homeScore:
          type: integer
        awayScore:
          type: integer
        playerInId:
          type: string
          format: uuid
          nullable: true
        playerOutId:
          type: string
          format: uuid
          nullable: true
        kind:
          $ref: "#/components/schemas/SubstitutionKind"
      required: [homeScore, awayScore, kind]

    # 暫停是哪一方叫的（issue #44）。跟 RallyWinner 一樣用 home/away（前端 us/opponent 在
    # mapping 層翻譯）。獨立一個 enum、不共用 RallyWinner，對齊後端各表各自定 pgEnum 的慣例。
    TimeoutSide:
      type: string
      enum: [home, away]

    Timeout:
      type: object
      properties:
        # id/setId 從整數改成 uuid（#64 PR1），理由同 MatchSet.id。
        id:
          type: string
          format: uuid
        setId:
          type: string
          format: uuid
        # 暫停發生的「時機」＝這一局當下的比分快照（而非 rallyId），理由見 lib/db/src/schema/timeouts.ts。
        homeScore:
          type: integer
        awayScore:
          type: integer
        side:
          $ref: "#/components/schemas/TimeoutSide"
        # 伺服器指派的插入順序流水號，理由跟 Substitution.seq 完全一樣——id 改成隨機 uuid
        # 後不能再當排序 tiebreaker，另開一個單純遞增的欄位給 orderBy 用。
        seq:
          type: integer
      required: [id, setId, homeScore, awayScore, side, seq]

    NewTimeout:
      type: object
      properties:
        # 選填的 client-mintable 主鍵，理由同 NewSet.id（#64 PR2）。
        id:
          type: string
          format: uuid
        homeScore:
          type: integer
        awayScore:
          type: integer
        side:
          $ref: "#/components/schemas/TimeoutSide"
      required: [homeScore, awayScore, side]

    # 一局的起始先發：我方六個號位（1~6）各站哪個球員。詳見 lib/db/src/schema/lineups.ts。
    # 自由球員（L）不出現在這六個號位——前端邏輯是 L 從場邊出發、換人上場，開局先發只有這 6 人；
    # L 另外用 startingLiberoId / liberoReplacesPlayerId 兩個可為 null 的欄位記（#359），
    # 記的是「L 頂替誰」而不是「L 站幾號位」（站哪格是推導值，見 schema 的說明）。
    # 「六人不得重複」與「有 replaces 就必須有 starting」DB 層都表達不了，交給 route 檢查
    # （跟 schema 註解一致）。
    Lineup:
      type: object
      properties:
        id:
          type: integer
        # setId 跟著 sets.id 從整數改成 uuid（#64 PR1）；lineups 自己的 id 維持整數
        # （這張表不在離線寫入契約範圍內，見 lib/db/src/schema/lineups.ts）。
        setId:
          type: string
          format: uuid
        zone1PlayerId:
          type: string
          format: uuid
        zone2PlayerId:
          type: string
          format: uuid
        zone3PlayerId:
          type: string
          format: uuid
        zone4PlayerId:
          type: string
          format: uuid
        zone5PlayerId:
          type: string
          format: uuid
        zone6PlayerId:
          type: string
          format: uuid
        # 這兩欄 nullable 且**必填**（required 裡有它們）：讀回來時一定看得到這兩個 key，
        # 「這局沒排 L」是明確的 null 而不是「欄位不見了」，前端不用分辨 undefined 與 null。
        startingLiberoId:
          type: string
          format: uuid
          nullable: true
        liberoReplacesPlayerId:
          type: string
          format: uuid
          nullable: true
      required:
        [
          id,
          setId,
          zone1PlayerId,
          zone2PlayerId,
          zone3PlayerId,
          zone4PlayerId,
          zone5PlayerId,
          zone6PlayerId,
          startingLiberoId,
          liberoReplacesPlayerId,
        ]

    NewLineup:
      type: object
      properties:
        zone1PlayerId:
          type: string
          format: uuid
        zone2PlayerId:
          type: string
          format: uuid
        zone3PlayerId:
          type: string
          format: uuid
        zone4PlayerId:
          type: string
          format: uuid
        zone5PlayerId:
          type: string
          format: uuid
        zone6PlayerId:
          type: string
          format: uuid
        # 寫入端這兩欄是**選填**（不在 required 裡）：PUT 是整份覆寫，沒帶就等於「這局沒有 L」，
        # 會寫成 null。這跟讀取端刻意不對稱——讀的人需要一個永遠存在的 key，寫的人不該被逼著
        # 為「我沒有自由球員」多打兩個 null。
        startingLiberoId:
          type: string
          format: uuid
          nullable: true
        liberoReplacesPlayerId:
          type: string
          format: uuid
          nullable: true
      required:
        [zone1PlayerId, zone2PlayerId, zone3PlayerId, zone4PlayerId, zone5PlayerId, zone6PlayerId]

    EventAction:
      type: string
      enum: [serve, receive, set, attack, block, dig]

    # 只在 receive/dig 動作才有意義，用來把一傳/防守細分成接發/接扣(S)/嗆司/接吊(T)四類做統計。
    # cover（掩護）＝ 攔網後的防守，是 #51 加的第四類（event-grammar-spec 對照表 D7）。
    BallType:
      type: string
      enum: [serve, spike, tip, chance, cover]

    # 發球種類（#51／event-grammar-spec 決策 6）：純進階版欄位，簡易版不分類。
    # jump = 跳發、float = 飄球、jump_float = 跳飄。
    ServeType:
      type: string
      enum: [jump, float, jump_float]

    EventSource:
      type: string
      enum: [live, review]

    # 這一球由哪一方執行（home = 我方、away = 對方），跟 RallyWinner（誰得分）是不同概念。
    # 見 lib/db/src/schema/events.ts 的 eventSideEnum。
    EventSide:
      type: string
      enum: [home, away]

    # 這一球「怎麼終結」，以執行這球的一方（EventSide）為基準去看，不是以我方為基準：
    #   outcome = (event.side === rally.winner) ? "point" : "loss"
    # 例：我方扣球被攔死 → side=home、winner=away → loss；對手攔網得分 → side=away、winner=away
    # → point。in_play（球續）只會出現在進階版逐球記錄；簡易版一 rally 只記一顆決定球，
    # 所以簡易版的 outcome 永遠是 point 或 loss。見 docs/event-grammar-spec.md 決策 7。
    EventOutcome:
      type: string
      enum: [point, loss, in_play]

    MatchEvent:
      type: object
      properties:
        # id/rallyId 從整數改成 uuid（#64 PR1），理由同 MatchSet.id。
        id:
          type: string
          format: uuid
        rallyId:
          type: string
          format: uuid
        sequence:
          type: integer
        # 哪一方執行這球，見 EventSide。
        side:
          $ref: "#/components/schemas/EventSide"
        # nullable：只有我方 (side = home) 動作對得到名單球員；對方動作與簡易版「對手(全體)」留空。
        playerId:
          type: string
          format: uuid
          nullable: true
        action:
          $ref: "#/components/schemas/EventAction"
        ballType:
          $ref: "#/components/schemas/BallType"
        # 發球種類，只有 action = serve 且是進階版補填時才有值（#51）。
        serveType:
          $ref: "#/components/schemas/ServeType"
          nullable: true
        # 0~3 品質評分，0 = 直接失誤，3 = 完美到位。用來算「到位率」。
        quality:
          type: integer
          nullable: true
        # 跟前端球場 SVG 同一個座標系：viewBox 0~100 (寬) x 0~200 (長)。
        # nullable：只有進階版（賽後精確記落點）才填；簡易版只記動作、不點座標。
        fromX:
          type: number
          nullable: true
        fromY:
          type: number
          nullable: true
        toX:
          type: number
          nullable: true
        toY:
          type: number
          nullable: true
        tags:
          type: array
          items:
            type: string
        note:
          type: string
          nullable: true
        # 對應 YouTube 播放秒數，只有 source = 'review' 時才會有值。
        videoTimestamp:
          type: integer
          nullable: true
        source:
          $ref: "#/components/schemas/EventSource"
        # 這球怎麼終結，見 EventOutcome。nullable：舊資料與「沒看到」路徑可能沒有值。
        outcome:
          $ref: "#/components/schemas/EventOutcome"
          nullable: true
      required: [id, rallyId, sequence, side, action, tags, source]

    NewEvent:
      type: object
      properties:
        # 選填的 client-mintable 主鍵，理由同 NewSet.id（#64 PR2）。
        id:
          type: string
          format: uuid
        sequence:
          type: integer
        side:
          $ref: "#/components/schemas/EventSide"
        playerId:
          type: string
          format: uuid
          nullable: true
        action:
          $ref: "#/components/schemas/EventAction"
        ballType:
          $ref: "#/components/schemas/BallType"
        serveType:
          $ref: "#/components/schemas/ServeType"
          nullable: true
        quality:
          type: integer
          nullable: true
        fromX:
          type: number
          nullable: true
        fromY:
          type: number
          nullable: true
        toX:
          type: number
          nullable: true
        toY:
          type: number
          nullable: true
        tags:
          type: array
          items:
            type: string
        note:
          type: string
          nullable: true
        videoTimestamp:
          type: integer
          nullable: true
        source:
          $ref: "#/components/schemas/EventSource"
        outcome:
          $ref: "#/components/schemas/EventOutcome"
          nullable: true
      required: [sequence, side, action, source]

    Tactic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        # 這份戰術所屬的比賽 id（#119）。matches.id 是 serial 整數，所以這裡是 integer 不是 uuid。
        # null 代表 #119 之前存的舊戰術（沒有歸屬某場）。
        matchId:
          type: integer
          nullable: true
        name:
          type: string
        # TacticsState 的完整快照，以 jsonb 存在 DB，前端直接解析成 TacticsState 型別。
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, data, createdAt, updatedAt]

    NewTactic:
      type: object
      properties:
        # 存檔時帶上當前比賽 id，讓這份戰術歸屬到這場（#119）。optional/nullable：不帶就是全域戰術，
        # 保留舊行為的相容性，但正常路徑前端都會帶。
        matchId:
          type: integer
          nullable: true
        name:
          type: string
        data:
          type: object
          additionalProperties: true
      required: [name, data]

    UpdateTactic:
      type: object
      properties:
        # 把一份存檔戰術改掛到別場、或改成全域（#385）。ADR-0007 之後 matchId 已經是
        # 「可選標籤」而不是擁有關係，改標籤因此是正當操作，不是資料搬遷。
        # nullable 的三種狀態同 NewTactic：帶整數＝改掛那場、帶 null＝變成全域戰術、
        # 完全不帶＝不動它。
        matchId:
          type: integer
          nullable: true
        name:
          type: string
        data:
          type: object
          additionalProperties: true

    UpdateEvent:
      type: object
      properties:
        side:
          $ref: "#/components/schemas/EventSide"
        # 賽後看影片補記時，把一球從「對手(全體)」改指到某位球員（#385）。這是進階版
        # 「賽後補填」定位的直接需求：簡易版比賽當下對手側沒有球員可指，歸屬本來就該事後補。
        # nullable：帶 uuid＝改指那個人、帶 null＝改回「不指定球員」、不帶＝不動它。
        # ⚠️ 後端會另外驗「那名球員屬不屬於這球所在的那場比賽」，見 routes/events.ts。
        playerId:
          type: string
          format: uuid
          nullable: true
        # 一球從 live 補成 review（或反過來）。跟 playerId 同一個情境：這球是當下記的還是
        # 事後補的，補記完之後才知道要改。
        source:
          $ref: "#/components/schemas/EventSource"
        action:
          $ref: "#/components/schemas/EventAction"
        ballType:
          $ref: "#/components/schemas/BallType"
        # 補填時把一顆發球分類成跳發/飄球/跳飄（#51）。nullable：帶 null＝改回未分類。
        serveType:
          $ref: "#/components/schemas/ServeType"
          nullable: true
        quality:
          type: integer
          nullable: true
        fromX:
          type: number
        fromY:
          type: number
        toX:
          type: number
        toY:
          type: number
        tags:
          type: array
          items:
            type: string
        note:
          type: string
          nullable: true
        videoTimestamp:
          type: integer
          nullable: true
        # 進階版賽後補填時，會用這支把 outcome 從 null 改成實際結果（#51 第一塊）。
        outcome:
          $ref: "#/components/schemas/EventOutcome"
          nullable: true
